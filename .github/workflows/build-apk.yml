name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-control-app-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: APK summary
        run: |
          echo "### APK pronto para download" >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artifact **vehicle-control-app-v${{ github.run_number }}** nesta execucao do workflow." >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
