name: vehicle_control_app
description: "Drive Control — controle inteligente de veículos e motoristas."
publish_to: 'none'
version: 0.3.30

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Roteamento
  go_router: ^14.2.0

  # Firebase (backend central: auth + status/histórico dos veículos)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Persistência local / fila offline
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilitários
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  signature: ^5.5.0
  printing: ^5.14.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  web: ^1.1.0

  # GPS e mapa (OpenStreetMap — gratis, sem API key)
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_tts: ^4.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#101828"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
