<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Drive Control — controle inteligente de veiculos e motoristas.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Drive Control">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Drive Control</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f5f6f8;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #101828;
      gap: 16px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #ffe8d4;
      border-top-color: #f77e1e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <strong>Drive Control</strong>
    <span>Carregando...</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    });

    setTimeout(function () {
      const loading = document.getElementById('loading');
      if (!loading) return;
      loading.innerHTML = '<strong>Drive Control</strong><p style="max-width:280px;text-align:center;padding:0 16px">Demorou para carregar. Limpe o cache do Chrome e abra novamente, ou use aba anonima.</p>';
    }, 45000);
  </script>
</body>
</html>
